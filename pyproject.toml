[build-system]
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[project]
name = "dragonhydra"
version = "0.4.0a1"
description = "Provenance-aware point-in-time football research laboratory"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.optional-dependencies]
server = ["fastapi==0.162.0", "uvicorn==0.42.0", "openpyxl==3.1.5", "tzdata==2026.2"]
verification = ["httpx==0.28.1", "playwright==1.58.0"]

[project.scripts]
dragon = "dragonhydra.packaging_entry:main"
dragonhydra-server = "dragonhydra.server:main"
dragonhydra-samples = "dragonhydra.samples:main"

[tool.uv.build-backend]
module-name = "dragonhydra"
source-include = ["tests/**", "examples/**", "docs/**", "dragon.py", "packaging/**", "scripts/build_checkpoint_archive.py"]
source-exclude = ["/data", "/runtime", "/dist", "__pycache__", "*.pyc"]

